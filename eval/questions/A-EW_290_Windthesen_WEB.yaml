- id: windthesen-21
  document: A-EW_290_Windthesen_WEB.pdf
  question: "Wie viel Gigawatt Windenergie auf See sollen in Deutschland bis 2030 installiert sein?"
  answerable: false
  gold: []
  # why not answerable: Das Papier behandelt nur Windenergie an Land (115 GW bis 2030) und erwähnt Windflächen auf See nur als Vorbild für die Voruntersuchung von Flächen, nennt aber kein Offshore-Ziel.

