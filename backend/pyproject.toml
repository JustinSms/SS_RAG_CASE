[project]
name = "document-chat-api"
version = "0.1.0"
description = "Document Chat backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "anthropic",
    "pgvector>=0.5.0",
    "python-multipart>=0.0.32",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "sentence-transformers",
    "torch",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

# Linux (the Docker image) gets the CPU-only torch wheel, a few GB smaller than the default.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
