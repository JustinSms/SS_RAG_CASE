services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: docchat
      POSTGRES_PASSWORD: docchat
      POSTGRES_DB: docchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docchat -d docchat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: env/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://docchat:docchat@db:5432/docchat
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Retrieval evaluation, started on demand only:
  #   docker compose --profile eval run --rm eval python run.py
  # Same image as api, with eval/ mounted. Its own database (docchat_eval) and uploads volume.
  eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/eval
    command: ["python", "ingest.py"]
    env_file:
      - path: env/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://docchat:docchat@db:5432/docchat_eval
      UPLOADS_DIR: /data/eval-uploads
    volumes:
      - ./eval:/app/eval
      - eval_uploads:/data/eval-uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  eval_uploads:
