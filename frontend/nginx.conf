server {
    listen 80;

    # MAX_UPLOAD_MB in env/config.py (nginx cannot read it), plus 1 MB for the multipart wrapping.
    # The browser sends one file per request, so this limit applies per file.
    client_max_body_size 11m;

    root /usr/share/nginx/html;
    index index.html;

    # Streamed answers (SSE): pass chunks through as they arrive.
    location /api/chat {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # React Router: unknown paths serve the app.
    location / {
        try_files $uri /index.html;
    }
}
